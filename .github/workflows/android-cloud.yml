name: Android cloud build

on:
  push:
    branches: [ "cloud-save" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (arm64-v8a, cloud save)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" > /dev/null 2>&1 || true
          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)
            NDK_DIR="${NDK_DIR%/}"
          fi
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pvz-portable-android-cloud
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
